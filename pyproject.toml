[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orion"
version = "0.1.0"
description = "ORION: autonomous Windows computer-use agent (Stage 1 shell)"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8",
    "pydantic>=2.7",
    "uiautomation>=2.0",   # Windows UI Automation (Notepad tools)
    "playwright>=1.44",    # local pages only; run `python -m playwright install chromium` once
    "rapidocr-onnxruntime>=1.4",   # local OCR for visual grounding (Apache-2.0; onnxruntime MIT)
    "python-docx>=1.1",            # Word documents (MIT)
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0"]   # local speech recognition (MIT)
dev = ["pytest>=8", "pytest-timeout>=2.3"]
# Training the grounding scorer (sklearn) and the visual model (torch: install the CUDA build from
# https://download.pytorch.org/whl/cu128 for the RTX GPU). Not needed to run ORION.
ml = ["scikit-learn>=1.5", "joblib>=1.4", "torch>=2.4", "torchvision>=0.19", "transformers>=4.45",
      "peft>=0.12", "sentencepiece>=0.2", "protobuf>=4"]

[project.scripts]
orion = "orion.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = [
    "mock: uses simulated actions only, no real desktop/browser control",
    "real: touches the real desktop (opens an ORION window); no other apps",
    "safety: safety-critical behaviour (kill switch, dry-run, redaction)",
    "ui: needs Qt (runs offscreen unless also marked real)",
]
